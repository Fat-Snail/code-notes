<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Octopus - Fat-Snail 开源项目</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Fat-Snail 开源项目文档，涵盖 Octopus 系列、AI 应用、网络通信、前端工具等">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --base-font-size: 15px;
      --base-line-height: 1.6;
      --base-color: #24292f;
      --base-background-color: #ffffff;

      --link-color: #0969da;
      --link-color--hover: #0550ae;

      --sidebar-background: #f6f8fa;
      --sidebar-border-color: #d0d7de;
      --sidebar-width: 260px;
      --sidebar-nav-link-color: #24292f;
      --sidebar-nav-link-color--active: #0969da;
      --sidebar-nav-link-font-weight--active: 600;

      --navbar-background: #ffffff;
      --navbar-border-color: #d0d7de;

      --cover-background-color: #0969da;

      --code-font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --code-font-size: 13px;
      --code-background: #f6f8fa;
      --code-block-background: #f6f8fa;
      --code-block-border-radius: 6px;
      --code-block-padding: 16px;
      --code-theme-background: #f6f8fa;
      --code-theme-text: #24292f;

      --blockquote-border-color: #d0d7de;
      --blockquote-color: #57606a;

      --table-head-background: #f6f8fa;
      --table-cell-border-color: #d0d7de;

      --heading-h1-font-size: 1.8em;
      --heading-h2-font-size: 1.4em;
      --heading-h2-border-color: #d0d7de;
    }
  </style>
  <!-- Favicon 配置 -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'Octopus',
      repo: 'https://github.com/Fat-Snail',
      loadSidebar: true,
      loadNavbar: true,
      mergeNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      alias: {
        '/.*/_navbar.md': '/_navbar.md',
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档',
        noData: '找不到结果',
        depth: 6
      },
      copyCode: {
        buttonText: '复制代码',
        errorText: '复制失败',
        successText: '已复制'
      },
      pagination: {
        previousText: '上一页',
        nextText: '下一页',
        crossChapter: true,
        crossChapterText: true
      },
      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      }
    }
  </script>
  <!-- docsify-themeable -->
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <!-- Docsify v4 -->
  <script src="//unpkg.com/docsify@4"></script>
  <!-- 搜索插件 -->
  <script src="//unpkg.com/docsify/lib/plugins/search.min.js"></script>
  <!-- 复制代码插件 -->
  <script src="//unpkg.com/docsify-copy-code@2"></script>
  <!-- 分页插件 -->
  <script src="//unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- 字数统计插件 -->
  <script src="//unpkg.com/docsify-count/dist/countable.min.js"></script>
  <!-- 代码高亮 -->
  <script src="//unpkg.com/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//unpkg.com/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="//unpkg.com/prismjs@1/components/prism-python.min.js"></script>
  <script src="//unpkg.com/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//unpkg.com/prismjs@1/components/prism-json.min.js"></script>
  <script src="//unpkg.com/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
